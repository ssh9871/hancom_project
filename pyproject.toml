[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwpx-cli"
version = "0.1.0"
description = "Preserving ZIP/XML HWPX editor with optional MCP tools"
requires-python = ">=3.11"
dependencies = ["lxml>=5.3,<7", "Pillow>=10,<13", "cryptography>=43,<47"]

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]

[project.scripts]
hwpx = "hwpx_cli.cli:main"

[tool.setuptools.packages.find]
include = ["hwpx_cli*"]

[tool.setuptools.package-data]
hwpx_cli = ["operations.md"]
